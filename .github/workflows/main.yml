name: Deploy bt-classes to AWS Lambda

on:
  push:
    branches:
      - main  # Ou qualquer branch que você deseja monitorar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build:ts  # Certifique-se de ter um script de build no seu package.json

      - name: Zip files
        run: zip -r lambda-deploy.zip ./dist ./node_modules ./rds-ca-2019-root.pem

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: 'AKIAXYKJSTX7A7FRH6E7'
          aws-secret-access-key: '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'
          aws-region: 'sa-east-1'

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code --function-name bt-classes --zip-file fileb://lambda-deploy.zip
